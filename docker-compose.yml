# homeassistant-xiaozhiserver — 小智 MCP 接入点 bridge + WebUI
# 用法：cp .env.example .env，填写 MCP_ENDPOINT / HA_URL / HA_TOKEN，然后：
#   docker compose pull && docker compose up -d
# 一个容器同时运行 MCP 桥接和 WebUI；使用 host 网络，WebUI 通过 WEBUI_PORT 暴露到宿主机，无独立密码。
services:
  homeassistant-xiaozhiserver:
    image: ghcr.io/kid941005/homeassistant-xiaozhiserver:latest
    # 如需本地构建，注释掉 image 并启用下面两行 build。
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: homeassistant-xiaozhiserver
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    # 依赖一次性目录初始化，保证 bind mount 对容器用户可写
    depends_on:
      init-logs:
        condition: service_completed_successfully
    # 直接使用宿主机网络栈，WebUI 监听宿主机 WEBUI_HOST:WEBUI_PORT，无需 ports 映射。
    network_mode: host
    env_file:
      - .env
    environment:
      LOG_FILE: /app/logs/homeassistant-xiaozhiserver.log
      # host 网络下 WebUI 直接监听宿主机端口；默认 0.0.0.0:8099
      WEBUI_HOST: ${WEBUI_HOST:-0.0.0.0}
      WEBUI_PORT: ${WEBUI_PORT:-8099}
    volumes:
      - ./xiaozhi-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性修正宿主机目录所有权；bind mount 目录由 Docker 创建时可能是 root:root
  init-logs:
    image: ghcr.io/kid941005/homeassistant-xiaozhiserver:latest
    container_name: homeassistant-xiaozhiserver-init-logs
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /app/logs && chown -R 10001:10001 /app/logs"]
    volumes:
      - ./xiaozhi-logs:/app/logs
    restart: "no"
