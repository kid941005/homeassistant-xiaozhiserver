# homeassistant-xiaozhiserver — 小智 MCP 接入点 bridge + WebUI
# 用法：
#   cp .env.example .env，填写 MCP_ENDPOINT / HA_URL / HA_TOKEN / WEBUI_TOKEN
#   mkdir -p ./xiaozhi-logs && sudo chown -R "$(id -u):$(id -g)" ./xiaozhi-logs
#   如宿主机 UID/GID 不是 1000，在 .env 中设置 PUID/PGID（compose 的 user 会使用）
#   docker compose pull && docker compose up -d
# 一个容器同时运行 MCP 桥接和 WebUI；使用 host 网络，WebUI 通过 WEBUI_HOST:WEBUI_PORT 暴露到宿主机。
services:
  homeassistant-xiaozhiserver:
    image: ghcr.io/kid941005/homeassistant-xiaozhiserver:latest
    # 如需本地构建，注释掉 image 并启用下面两行 build。
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: homeassistant-xiaozhiserver
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    user: "${PUID:-1000}:${PGID:-1000}"
    # 直接使用宿主机网络栈，WebUI 监听宿主机 WEBUI_HOST:WEBUI_PORT，无需 ports 映射。
    network_mode: host
    env_file:
      - .env
    environment:
      LOG_FILE: ${LOG_FILE:-/app/logs/homeassistant-xiaozhiserver.log}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      TZ: ${TZ:-Asia/Shanghai}
      WEBUI_HOST: ${WEBUI_HOST:-0.0.0.0}
      WEBUI_PORT: ${WEBUI_PORT:-8099}
      WEBUI_TOKEN: ${WEBUI_TOKEN:-}
      WEBUI_CACHE_TTL: ${WEBUI_CACHE_TTL:-3.0}
      CONTROL_CONCURRENCY: ${CONTROL_CONCURRENCY:-5}
      CONTROL_BATCH_TIMEOUT: ${CONTROL_BATCH_TIMEOUT:-8.0}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    volumes:
      - ./xiaozhi-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
