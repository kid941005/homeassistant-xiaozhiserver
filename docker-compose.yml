# homeassistant-xiaozhiserver — 小智 MCP 接入点 bridge + WebUI
# 用法：cp .env.example .env，填写 MCP_ENDPOINT / HA_URL / HA_TOKEN，然后：
#   docker compose pull && docker compose up -d
# 一个容器同时运行 MCP 桥接和 WebUI；WebUI 固定 8099，无独立密码。
services:
  homeassistant-xiaozhiserver:
    image: ghcr.io/kid941005/homeassistant-xiaozhiserver:latest
    # 如需本地构建，注释掉 image 并启用下面两行 build。
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: homeassistant-xiaozhiserver
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      LOG_FILE: /app/logs/homeassistant-xiaozhiserver.log
    # WEBUI_PORT 可覆盖宿主机/容器端口；容器内监听地址由 .env 的 WEBUI_HOST 决定（默认 0.0.0.0）。
    ports:
      - "${WEBUI_PORT:-8099}:${WEBUI_PORT:-8099}"
    volumes:
      - xiaozhi-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xiaozhi-logs:
