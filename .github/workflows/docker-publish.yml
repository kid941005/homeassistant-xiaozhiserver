name: Build and publish GHCR + Docker Hub image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, must match homeassistant_xiaozhiserver/__init__.py"
        required: true
        default: "1.15.3"
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline test suite
        env:
          TEST_TOKEN: ci-test-token
        run: bash tests/run_local_test.sh

  build-and-push:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # PR 构建只验证镜像可构建，不推送；tag 名不是版本号时回退到代码版本。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' homeassistant_xiaozhiserver/__init__.py)"
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$OWNER/homeassistant-xiaozhiserver:$VERSION"
            echo "ghcr.io/$OWNER/homeassistant-xiaozhiserver:latest"
            if [ -n "$DOCKERHUB_USER" ]; then
              echo "$DOCKERHUB_USER/homeassistant-xiaozhiserver:$VERSION"
              echo "$DOCKERHUB_USER/homeassistant-xiaozhiserver:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version matches source
        run: |
          CODE_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' homeassistant_xiaozhiserver/__init__.py)"
          if [ "$CODE_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "版本不一致：镜像 tag=${{ steps.meta.outputs.version }}，代码 __version__=$CODE_VERSION" >&2
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=homeassistant-xiaozhiserver
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
