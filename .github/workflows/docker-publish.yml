name: Build and publish GHCR + Docker Hub image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, must match homeassistant_xiaozhiserver/__init__.py"
        required: true
        default: "1.15.5"
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline test suite
        env:
          TEST_TOKEN: ci-test-token
        run: bash tests/run_local_test.sh

  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' homeassistant_xiaozhiserver/__init__.py)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "版本格式非法：$VERSION" >&2
            exit 1
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$OWNER/homeassistant-xiaozhiserver:$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version matches source
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CODE_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' homeassistant_xiaozhiserver/__init__.py)"
          if [ "$CODE_VERSION" != "$META_VERSION" ]; then
            echo "版本不一致：镜像 tag=$META_VERSION，代码 __version__=$CODE_VERSION" >&2
            exit 1
          fi

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=homeassistant-xiaozhiserver
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          OWNER="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          VERSION="${INPUT_VERSION:-}"
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "版本格式非法：$VERSION" >&2
            exit 1
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$OWNER/homeassistant-xiaozhiserver:$VERSION"
            if [ "$EVENT_NAME" = "push" ] && [ "${REF_NAME#v}" != "$REF_NAME" ]; then
              echo "ghcr.io/$OWNER/homeassistant-xiaozhiserver:latest"
            fi
            if [ -n "$DOCKERHUB_USER" ]; then
              echo "$DOCKERHUB_USER/homeassistant-xiaozhiserver:$VERSION"
              if [ "$EVENT_NAME" = "push" ] && [ "${REF_NAME#v}" != "$REF_NAME" ]; then
                echo "$DOCKERHUB_USER/homeassistant-xiaozhiserver:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version matches source
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CODE_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' homeassistant_xiaozhiserver/__init__.py)"
          if [ "$CODE_VERSION" != "$META_VERSION" ]; then
            echo "版本不一致：镜像 tag=$META_VERSION，代码 __version__=$CODE_VERSION" >&2
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=homeassistant-xiaozhiserver
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
